name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Retrace.Exit.slnx --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Pack (verify the tool nupkg builds)
        run: dotnet pack src/Retrace.Exit/Retrace.Exit.csproj --configuration Release

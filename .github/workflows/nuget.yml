# Tag-triggered or manual pack + NuGet.org push via Trusted Publishing (OIDC).
# This workflow is not run automatically on ordinary commits.
# Trusted Publishing policy on nuget.org: owner=aykutmayali, repo=aykutmayali/retrace-exit,
# workflow=nuget.yml, no environment, package=Retrace.Exit.
name: NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.1.0"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${VERSION}"

      - name: Test
        run: dotnet test Retrace.Exit.slnx --configuration Release

      - name: Pack
        run: dotnet pack src/Retrace.Exit/Retrace.Exit.csproj --configuration Release --output ./nupkg -p:Version=${{ steps.version.outputs.VERSION }}

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: aykutmayali

      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkg/Retrace.Exit.*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
